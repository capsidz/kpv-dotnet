services:
  db:
    image: postgres:18
    container_name: approval_service_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 2711
      POSTGRES_DB: approval_service_db
    ports:
      - "5437:5432"
    volumes:
      - approval_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: approval_service_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - approval_redis_data:/data

  ollama:
    image: ollama/ollama
    container_name: approval_service_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama


volumes:
  approval_postgres_data:
  approval_redis_data:
  ollama_data: